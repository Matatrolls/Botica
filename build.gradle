plugins {
    id 'java'
    id 'net.serenity-bdd.serenity-gradle-plugin' version '4.3.1'
}

ext {
    serenityVersion = '4.3.1'
    seleniumVersion = '4.38.0'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.14.0'
    testImplementation 'org.junit.jupiter:junit-jupiter-engine:5.14.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testImplementation "net.serenity-bdd:serenity-junit:$serenityVersion"
    implementation "net.serenity-bdd:serenity-core:$serenityVersion"
    implementation "net.serenity-bdd:serenity-cucumber:$serenityVersion"
    implementation "net.serenity-bdd:serenity-screenplay:$serenityVersion"
    implementation "net.serenity-bdd:serenity-screenplay-webdriver:$serenityVersion"

    testImplementation "org.seleniumhq.selenium:selenium-java:$seleniumVersion"
    testImplementation "org.seleniumhq.selenium:selenium-chrome-driver:$seleniumVersion"
}

test {
    useJUnitPlatform()
    test.finalizedBy(aggregate)

    // Propagar filtros de Cucumber desde CI o ejecución manual
    systemProperty 'cucumber.filter.tags', System.getProperty('cucumber.filter.tags', '')
    systemProperty 'cucumber.plugin', System.getProperty('cucumber.plugin', 'pretty')

    // Pasar propiedades del sistema a los tests
    systemProperties = System.properties
}

